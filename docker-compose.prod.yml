# Production stack: the built SPA served by nginx.
#
#   VITE_API_BASE_URL=https://api.example.com \
#     docker compose -f docker-compose.prod.yml up --build -d
#
# VITE_API_BASE_URL is consumed at BUILD time — Vite inlines it into the bundle,
# so it is passed as a build argument rather than an environment variable. A
# change to it requires a rebuild, not a restart.

name: mailpulse-front

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL to the API origin, e.g. https://api.example.com}
    container_name: mailpulse-front
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
